<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMI 작업 지도</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2eae4b699110525f0dc62295ed8ed43d&autoload=false"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100vh; }
        
        .custom-marker { position: relative; width: 20px; height: 26px; cursor: pointer; }
        .custom-marker svg { width: 100%; height: 100%; }
        .custom-marker.green  .pin-body { fill: #10b981; }
        .custom-marker.gray   .pin-body { fill: #4b5563; }
        .custom-marker.blue   .pin-body { fill: #3b82f6; }
        .custom-marker.red    .pin-body { fill: #ef4444; }
        .custom-marker.yellow .pin-body { fill: #f59e0b; }
        /* 리스트1(미완·폴백): 흰 원 표시 / 리스트2(완료·보류·불가): 꽉찬 핀 */
        .pin-circle { display: none; }
        .custom-marker.green .pin-circle,
        .custom-marker.yellow .pin-circle { display: block; }
        .marker-number { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: bold; color: white; line-height: 1; pointer-events: none; }
        .custom-marker.green .marker-number,
        .custom-marker.yellow .marker-number { color: #1f2937; }
        
        .fullpage-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: white; z-index: 1000; display: none; flex-direction: column; }
        .fullpage-overlay.active { display: flex; }
        
        .overlay-header { padding: 16px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }
        .overlay-address { flex: 1; }
        .overlay-address h3 { font-size: 18px; margin-bottom: 6px; color: #111827; font-weight: 700; }
        .overlay-address p { font-size: 13px; color: #6b7280; line-height: 1.4; }
        .header-buttons { display: flex; gap: 8px; }
        .tmap-btn { padding: 8px 14px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; font-weight: 600; }
        .close-btn { width: 32px; height: 32px; border: none; background: #e5e7eb; border-radius: 6px; cursor: pointer; font-size: 20px; line-height: 1; color: #374151; font-weight: 600; }
        
        .overlay-actions { padding: 16px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; flex-wrap: wrap; background: white; flex-shrink: 0; }
        .action-btn { padding: 10px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; cursor: pointer; background: white; transition: all 0.2s; font-weight: 600; }
        .action-btn.complete { border-color: #10b981; color: #10b981; }
        .action-btn.complete.active { background: #10b981; color: white; }
        .action-btn.reset { border-color: #6b7280; color: #6b7280; }
        .action-btn.reset:active { background: #6b7280; color: white; }
        .action-btn.hold { border-color: #3b82f6; color: #3b82f6; }
        .action-btn.hold.active { background: #3b82f6; color: white; }
        .action-btn.fail { border-color: #ef4444; color: #ef4444; }
        .action-btn.fail.active { background: #ef4444; color: white; }
        .fail-reason { flex: 1; min-width: 200px; padding: 10px 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }
        .common-pole { padding: 8px 16px; background: #eff6ff; border-bottom: 1px solid #dbeafe; font-size: 13px; color: #1d4ed8; font-weight: 600; flex-shrink: 0; }
        
        .overlay-meters { flex: 1; overflow-y: auto; padding: 16px; background: #f9fafb; }
        .meter-item { margin-bottom: 10px; padding: 12px; background: white; border-radius: 8px; display: flex; align-items: flex-start; gap: 10px; border: 1px solid #e5e7eb; }
        .meter-checkbox { width: 20px; height: 20px; cursor: pointer; margin-top: 2px; flex-shrink: 0; accent-color: #10b981; }
        .meter-info { flex: 1; font-size: 13px; line-height: 1.6; word-break: break-all; }
        .meter-type { display: inline-block; padding: 3px 8px; background: #3b82f6; color: white; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; }
        .meter-number { font-weight: 700; color: #111827; }
        .meter-details { color: #6b7280; font-size: 12px; margin-top: 4px; }
        .meter-no-seg { letter-spacing: 0; }
        .meter-no-seg .seg { display: inline-block; }
        .meter-no-seg .seg + .seg { margin-left: 0.15em; }
        .seg-type { color: #5B90BC; font-weight: 500; }
        .seg-dup  { color: #E24B4A; font-weight: 500; }
        .copy-btn { background: none; border: none; cursor: pointer; padding: 0 3px; color: #9ca3af; line-height: 1; vertical-align: middle; display: inline-flex; align-items: center; }
        .copy-btn:hover { color: #374151; }
        .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(17,24,39,0.85); color: white; padding: 8px 18px; border-radius: 20px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 9999; white-space: nowrap; }
        .toast.show { opacity: 1; }
        .loc-btn { position: fixed; bottom: 16px; right: 16px; z-index: 500; width: 40px; height: 40px; border-radius: 50%; border: none; background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .loc-btn.active { background: #3b82f6; color: white; }

        .backup-controls { position: fixed; top: 10px; right: 10px; z-index: 500; display: flex; gap: 6px; }
        .backup-controls button { padding: 6px 10px; font-size: 12px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; opacity: 0.9; box-shadow: 0 1px 4px rgba(0,0,0,0.25); }
        .backup-controls .btn-backup { background: #374151; color: white; }
        .backup-controls .btn-restore { background: #374151; color: white; }
        .backup-controls button:hover { opacity: 1; }
        .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; align-self: center; box-shadow: 0 0 0 2px rgba(255,255,255,0.6); transition: background 0.4s; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="toast" class="toast">복사했습니다</div>
    <button class="loc-btn" id="loc-btn" onclick="toggleLocation()">◎</button>

    <div class="backup-controls">
        <div id="conn-dot" class="conn-dot" title="Firebase 연결 상태"></div>
        <button class="btn-backup" onclick="backupData()">💾 백업</button>
        <button class="btn-restore" onclick="document.getElementById('restore-input').click()">📂 복원</button>
        <input type="file" id="restore-input" accept=".json" style="display:none" onchange="restoreData(event)">
    </div>
    
    <div id="fullpage-overlay" class="fullpage-overlay">
        <div class="overlay-header">
            <div class="overlay-address">
                <h3 id="detail-address"></h3>
                <p id="detail-road-address"></p>
            </div>
            <div class="header-buttons">
                <button class="tmap-btn" id="tmap-btn">🚗 티맵</button>
                <button class="close-btn" onclick="closeDetail()">×</button>
            </div>
        </div>
        <div class="overlay-actions">
            <button class="action-btn complete" id="btn-complete">✅ 완료</button>
            <button class="action-btn hold" id="btn-hold">⏸️ 보류</button>
            <button class="action-btn fail" id="btn-fail">❌ 불가</button>
            <input type="text" class="fail-reason" id="fail-reason" placeholder="불가 사유">
        </div>
        <div id="common-pole" class="common-pole" style="display:none;"></div>
        <div class="overlay-meters" id="meters-list"></div>
    </div>

    <script>
let sampleData = [];

function parseType(meterNo) {
    const code = meterNo.substring(2, 4);
    if (code === '17') return 'E';
    if (code === '19') return 'EA';
    if (['25','26','27','45','46','47'].includes(code)) return 'G';
    if (code === '53' || code === '55') return 'Amigo';
    return null;
}

// ── Firebase 초기화 ──────────────────────────────────────
const firebaseConfig = {
    apiKey: "AIzaSyAqVaYGYLjT4qa8nQToYlSqnqtlgoFauWU",
    authDomain: "ami-work-1c49a.firebaseapp.com",
    databaseURL: "https://ami-work-1c49a-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ami-work-1c49a",
    storageBucket: "ami-work-1c49a.firebasestorage.app",
    messagingSenderId: "734048538037",
    appId: "1:734048538037:web:5514cb0a78ea03a4571dfc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const statusRef = db.ref('workStatus/charger4eleccar');

// 연결 상태 표시
db.ref('.info/connected').on('value', snap => {
    const connected = snap.val();
    console.log('[Firebase] 연결 상태:', connected ? '✅ 연결됨' : '🔴 오프라인');
    const dot = document.getElementById('conn-dot');
    if (dot) dot.style.background = connected ? '#10b981' : '#f59e0b';
});
// ──────────────────────────────────────────────────────────

const STORAGE_KEY = 'ami_work_status';
let workStatus = {};
let map;
let markers = [];
let currentAddress = '';
let currentMeters = [];

function loadStatusLocal() {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : {};
}

// Firebase에 쓰기 (debounce 300ms - 연속 입력 방지)
let _fbSaveTimer = null;
function saveStatus(status) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(status));
    clearTimeout(_fbSaveTimer);
    _fbSaveTimer = setTimeout(() => {
        console.log('[Firebase] saveStatus → set() 호출, 주소수:', Object.keys(status).length);
        statusRef.set(status)
            .then(() => console.log('[Firebase] set() 성공'))
            .catch(e => console.error('[Firebase] set() 실패:', e.code, e.message));
    }, 300);
}

// Firebase 초기 로드 + 실시간 리스너 설정
function initFirebase() {
    console.log('[Firebase] initFirebase 시작');
    return new Promise(resolve => {
        let initialLoad = true;

        statusRef.on('value', snapshot => {
            const fbData = snapshot.val() || {};
            console.log('[Firebase] onValue 콜백 — initialLoad:', initialLoad, '/ 키수:', Object.keys(fbData).length);

            if (initialLoad) {
                initialLoad = false;
                if (Object.keys(fbData).length === 0) {
                    // Firebase 비어있음 → localStorage 마이그레이션
                    const local = loadStatusLocal();
                    if (Object.keys(local).length > 0) {
                        workStatus = local;
                        console.log('[Firebase] 마이그레이션 시작, 주소수:', Object.keys(local).length);
                        statusRef.set(local)
                            .then(() => console.log('[Firebase] 마이그레이션 완료'))
                            .catch(e => console.error('[Firebase] 마이그레이션 실패:', e.code, e.message));
                    } else {
                        console.log('[Firebase] Firebase + localStorage 모두 비어있음');
                    }
                } else {
                    console.log('[Firebase] Firebase 데이터 로드 완료');
                    workStatus = fbData;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(fbData));
                }
                resolve();
            } else {
                // 다른 기기/사용자의 변경 → 실시간 반영
                console.log('[Firebase] 실시간 업데이트 수신 → 마커 갱신');
                workStatus = fbData;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(fbData));
                markers.forEach(m => updateMarkerColor(m.address));
            }
        }, error => {
            // 권한 오류 또는 네트워크 오류
            console.error('[Firebase] onValue 오류 — code:', error.code, '/ message:', error.message);
            console.warn('[Firebase] ⚠️ Firebase Rules에서 read 권한을 확인하세요.');
            workStatus = loadStatusLocal();
            resolve();
        });
    });
}

function backupData() {
    const data = JSON.stringify(workStatus, null, 2);
    const date = new Date().toISOString().slice(0,10);
    const blob = new Blob([data], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `ami_backup_${date}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
}

function migrateMeterNo(no) {
    // "68190227199.0" → "68190227199" 형식 정규화
    const s = String(no).trim();
    const n = parseFloat(s);
    if (!isNaN(n)) return String(Math.round(n)).padStart(11, '0');
    return s.padStart(11, '0');
}

function migrateBackup(data) {
    // checkedMeters 안의 구형 계기번호 형식 변환
    const migrated = {};
    for (const [addr, status] of Object.entries(data)) {
        migrated[addr] = {
            ...status,
            checkedMeters: (status.checkedMeters || []).map(migrateMeterNo)
        };
    }
    return migrated;
}

function restoreData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const parsed = JSON.parse(e.target.result);
            const migrated = migrateBackup(parsed);
            workStatus = migrated;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            statusRef.set(migrated).catch(() => {});
            markers.forEach(m => updateMarkerColor(m.address));
            alert('복원 완료!');
        } catch {
            alert('올바른 백업 파일이 아닙니다.');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

async function initMap() {
    workStatus = loadStatusLocal();
    const container = document.getElementById('map');
    const saved = (() => { try { return JSON.parse(localStorage.getItem('ami_map_view')); } catch { return null; } })();
    const options = {
        center: new kakao.maps.LatLng(saved ? saved.lat : 37.525, saved ? saved.lng : 126.960),
        level: saved ? saved.level : 4
    };
    map = new kakao.maps.Map(container, options);
    kakao.maps.event.addListener(map, 'idle', () => {
        const c = map.getCenter();
        localStorage.setItem('ami_map_view', JSON.stringify({ lat: c.getLat(), lng: c.getLng(), level: map.getLevel() }));
    });

    const siteSnap = await db.ref('siteData/charger4eleccar').get();
    sampleData = siteSnap.val() || [];
    console.log('[siteData] 로드 완료:', sampleData.length, '개');

    loadMarkers();
    await initFirebase();
    markers.forEach(m => updateMarkerColor(m.address));
}

function loadMarkers() {
    const grouped = {};
    sampleData.forEach(item => {
        const addr = item.주소;
        if (!grouped[addr]) {
            grouped[addr] = {
                meters: [],
                lat: item.lat,
                lng: item.lng,
                roadAddress: item.도로명주소
            };
        }
        grouped[addr].meters.push(item);
    });
    
    Object.entries(grouped).forEach(([addr, data]) => {
        const coords = new kakao.maps.LatLng(data.lat, data.lng);
        createMarker(coords, addr, data.meters);
    });
}

function createMarker(position, address, meters) {
    const status = workStatus[address] || { state: 'pending', checkedMeters: [], reason: '' };
    const meterCount = meters.length;
    
    const isApproximate = meters.some(m => m.좌표정확도 === 'approximate');
    let color = isApproximate ? 'yellow' : 'green';
    if (status.state === 'complete') color = 'gray';
    else if (status.state === 'hold') color = 'blue';
    else if (status.state === 'fail') color = 'red';
    const markerLabel = (isApproximate && status.state === 'pending') ? '?' : meterCount;

    const markerContent = `
        <div class="custom-marker ${color}">
            <svg viewBox="0 0 20 26" xmlns="http://www.w3.org/2000/svg">
                <path class="pin-body" d="M10 0C4.48 0 0 4.48 0 10c0 6.72 10 16 10 16s10-9.28 10-16C20 4.48 15.52 0 10 0z"/>
                <circle class="pin-circle" cx="10" cy="10" r="5.5" fill="white"/>
            </svg>
            <div class="marker-number">${markerLabel}</div>
        </div>
    `;
    
    const customOverlay = new kakao.maps.CustomOverlay({
        position: position,
        content: markerContent,
        yAnchor: 1
    });
    
    customOverlay.setMap(map);
    
    const markerDiv = customOverlay.a;
    markerDiv.addEventListener('click', () => {
        showDetail(address, meters);
    });
    
    markers.push({ overlay: customOverlay, address, meters, element: markerDiv });
}

function showDetail(address, meters) {
    currentAddress = address;
    currentMeters = meters;
    
    const status = workStatus[address] || { state: 'pending', checkedMeters: [], reason: '' };
    status.checkedMeters = status.checkedMeters || [];

    document.getElementById('detail-address').textContent = address;
    document.getElementById('detail-road-address').textContent = `📍 ${meters[0].도로명주소}`;
    
    document.getElementById('tmap-btn').onclick = () => {
        const roadAddr = meters[0].도로명주소;
        window.location.href = `tmap://search?name=${encodeURIComponent(roadAddr)}`;
    };
    
    const btnComplete = document.getElementById('btn-complete');
    const btnHold = document.getElementById('btn-hold');
    const btnFail = document.getElementById('btn-fail');
    
    if (status.state === 'complete') {
        btnComplete.textContent = '🔄 초기화';
        btnComplete.className = 'action-btn reset';
        btnComplete.onclick = () => resetStatus();
    } else {
        btnComplete.textContent = '✅ 완료';
        btnComplete.className = 'action-btn complete';
        btnComplete.onclick = () => { updateStatus('complete'); closeDetail(); };
    }

    btnHold.onclick = () => { updateStatus('hold'); closeDetail(); };
    btnFail.onclick = () => {
        const failInput = document.getElementById('fail-reason');
        const reason = failInput.value.trim();
        if (!reason) {
            failInput.style.borderColor = '#ef4444';
            return;
        }
        failInput.style.borderColor = '';
        updateStatus('fail');
        closeDetail();
    };
    
    [btnComplete, btnHold, btnFail].forEach(btn => btn.classList.remove('active'));
    if (status.state === 'complete') btnComplete.classList.add('active');
    if (status.state === 'hold') btnHold.classList.add('active');
    if (status.state === 'fail') btnFail.classList.add('active');
    
    const failInput = document.getElementById('fail-reason');
    failInput.value = status.reason || '';
    failInput.style.borderColor = '';
    failInput.oninput = (e) => {
        if (e.target.value.trim()) e.target.style.borderColor = '';
        if (!workStatus[currentAddress]) {
            workStatus[currentAddress] = { state: 'pending', checkedMeters: [], reason: '' };
        }
        workStatus[currentAddress].reason = e.target.value;
        saveStatus(workStatus);
    };
    
    const allSamePole = meters.length > 0 && meters.every(m => m.변대주 === meters[0].변대주);
    const commonPoleEl = document.getElementById('common-pole');
    if (allSamePole && meters[0].변대주) {
        commonPoleEl.textContent = `변대주 ${meters[0].변대주}`;
        commonPoleEl.style.display = 'block';
    } else {
        commonPoleEl.style.display = 'none';
    }

    // 뒤 2자리 중복 그룹 계산
    const suffix2Map = {};
    meters.forEach(m => {
        const s = m.계기번호.slice(-2);
        if (!suffix2Map[s]) suffix2Map[s] = [];
        suffix2Map[s].push(m.계기번호);
    });
    // suffix → 그룹 인덱스 (0-based)
    const dupGroupIndex = {};
    let gIdx = 0;
    Object.entries(suffix2Map).forEach(([s, nos]) => {
        if (nos.length > 1) dupGroupIndex[s] = gIdx++;
    });
    // 그룹 인덱스 → 행 배경/보더 인라인 스타일
    function rowStyle(s2) {
        if (dupGroupIndex[s2] === undefined) return 'background:#fff;border-color:#e5e7eb';
        const hue = dupGroupIndex[s2] * 20;
        return `background:hsl(${hue},100%,96%);border-color:hsl(${hue},80%,87%)`;
    }

    const metersList = document.getElementById('meters-list');
    metersList.innerHTML = meters.map(meter => {
        const checked = status.checkedMeters.includes(meter.계기번호) ? 'checked' : '';
        const parsedType = parseType(meter.계기번호) || meter.계기타입;
        const detailParts = [];
        if (!allSamePole && meter.변대주) detailParts.push(`변대주 ${meter.변대주}`);
        if (meter.상호 && meter.상호 !== '0') detailParts.push(`상호 ${meter.상호}`);
        const details = detailParts.join(', ');

        // 계기번호 4구간 색상 분리
        const no = meter.계기번호;
        const s2 = no.slice(-2);
        const isDup = dupGroupIndex[s2] !== undefined;
        const seg4Style = isDup ? 'class="seg seg-dup"' : 'class="seg"';
        const noHtml = `<span class="meter-no-seg">` +
            `<span class="seg">${no.slice(0, 2)}</span>` +
            `<span class="seg seg-type">${no.slice(2, 4)}</span>` +
            `<span class="seg">${no.slice(4, -2)}</span>` +
            `<span ${seg4Style}>${s2}</span>` +
            `</span>`;

        const copyBtn = `<button class="copy-btn" data-copy="${meter.계기번호}" title="계기번호 복사"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`;
        return `
            <div class="meter-item" style="${rowStyle(s2)}">
                <input type="checkbox" class="meter-checkbox"
                       data-meter="${meter.계기번호}" ${checked}>
                <div class="meter-info">
                    <span class="meter-type">${parsedType}</span>
                    ${noHtml}${copyBtn}
                    ${details ? `<div class="meter-details">${details}</div>` : ''}
                </div>
            </div>
        `;
    }).join('');
    
    setTimeout(() => {
        document.querySelectorAll('.meter-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', (e) => {
                toggleMeterCheck(e.target.dataset.meter);
            });
        });
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                copyMeterNo(btn.dataset.copy);
            });
        });
    }, 100);
    
    document.getElementById('fullpage-overlay').classList.add('active');
}

function closeDetail() {
    document.getElementById('fullpage-overlay').classList.remove('active');
}

let toastTimer = null;
function copyMeterNo(no) {
    navigator.clipboard.writeText(no).then(() => {
        const t = document.getElementById('toast');
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    });
}

let locationOverlay = null;
let locationWatchId = null;
let locationActive = false;
function toggleLocation() {
    const btn = document.getElementById('loc-btn');
    if (!locationActive) {
        if (!navigator.geolocation) { alert('위치 서비스를 지원하지 않는 브라우저입니다.'); return; }
        locationWatchId = navigator.geolocation.watchPosition(pos => {
            const latlng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            if (!locationOverlay) {
                const dot = document.createElement('div');
                dot.style.cssText = 'width:14px;height:14px;background:#3b82f6;border:2px solid white;border-radius:50%;box-shadow:0 0 0 4px rgba(59,130,246,0.25);';
                locationOverlay = new kakao.maps.CustomOverlay({ position: latlng, content: dot, zIndex: 10 });
                locationOverlay.setMap(map);
            } else {
                locationOverlay.setPosition(latlng);
            }
            map.setCenter(latlng);
        }, () => alert('위치를 가져올 수 없습니다.'), { enableHighAccuracy: true });
        locationActive = true;
        btn.classList.add('active');
    } else {
        if (locationWatchId !== null) navigator.geolocation.clearWatch(locationWatchId);
        if (locationOverlay) { locationOverlay.setMap(null); locationOverlay = null; }
        locationWatchId = null;
        locationActive = false;
        btn.classList.remove('active');
    }
}

function updateStatus(state) {
    if (!workStatus[currentAddress]) {
        workStatus[currentAddress] = { state: 'pending', checkedMeters: [], reason: '' };
    }
    workStatus[currentAddress].state = state;
    saveStatus(workStatus);
    updateMarkerColor(currentAddress);
}

function resetStatus() {
    if (!workStatus[currentAddress]) return;
    workStatus[currentAddress].state = 'pending';
    workStatus[currentAddress].checkedMeters = [];
    workStatus[currentAddress].reason = '';
    saveStatus(workStatus);
    updateMarkerColor(currentAddress);
    showDetail(currentAddress, currentMeters);
}

function toggleMeterCheck(meterNumber) {
    if (!workStatus[currentAddress]) {
        workStatus[currentAddress] = { state: 'pending', checkedMeters: [], reason: '' };
    }
    
    const checkedMeters = workStatus[currentAddress].checkedMeters || [];
    workStatus[currentAddress].checkedMeters = checkedMeters;
    const idx = checkedMeters.indexOf(meterNumber);
    
    if (idx > -1) {
        checkedMeters.splice(idx, 1);
    } else {
        checkedMeters.push(meterNumber);
    }
    
    saveStatus(workStatus);
}

function updateMarkerColor(address) {
    const marker = markers.find(m => m.address === address);
    if (!marker) return;

    const status = workStatus[address] || { state: 'pending' };
    const isApproximate = marker.meters.some(m => m.좌표정확도 === 'approximate');

    let color = isApproximate ? 'yellow' : 'green';
    if (status.state === 'complete') color = 'gray';
    else if (status.state === 'hold') color = 'blue';
    else if (status.state === 'fail') color = 'red';

    const el = marker.element.querySelector('.custom-marker');
    if (el) el.className = `custom-marker ${color}`;

    const labelEl = marker.element.querySelector('.marker-number');
    if (labelEl) labelEl.textContent = (isApproximate && status.state === 'pending') ? '?' : marker.meters.length;
}

kakao.maps.load(() => {
    initMap();
});
    </script>
</body>
