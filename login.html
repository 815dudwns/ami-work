<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - AMI 작업지도</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0C9266">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="아미맵">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            <!-- 앱 이름 -->
            <div class="login-header">
                <h1 class="login-title">AMI <span>작업지도</span></h1>
            </div>

            <!-- 로그인 폼 -->
            <form id="login-form" class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="input-id">아이디</label>
                    <input
                        type="text"
                        id="input-id"
                        placeholder="awms 아이디"
                        autocomplete="username"
                        autocapitalize="none"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="input-pw">비밀번호</label>
                    <input
                        type="password"
                        id="input-pw"
                        placeholder="비밀번호"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- 에러 메시지 -->
                <p id="error-msg" class="error-msg" aria-live="polite"></p>

                <button type="submit" id="login-btn" class="login-btn">로그인</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="js/fb-config.js?v=20261124c"></script>
    <script src="js/auth.js?v=20261124c"></script>
    <script>
        // 이미 로그인된 상태면 바로 map.html로 이동
        (function () {
            // 화면 세션 + Firebase 로그인 둘 다 있을 때만 바로 지도로(전환 전 세션만 있으면 여기서 로그인)
            if (authGetSession()) {
                authReady().then(u => {
                    if (u) window.location.href = 'map.html';
                    else localStorage.removeItem(AUTH_KEY);
                });
            }
        })();

        async function handleLogin(e) {
            e.preventDefault();
            const id  = document.getElementById('input-id').value.trim();
            const pw  = document.getElementById('input-pw').value;
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('error-msg');

            // 에러 초기화
            err.textContent = '';
            btn.disabled = true;
            btn.textContent = '로그인 중...';

            const result = await authLogin(id, pw);

            if (result.ok) {
                // 새로 로그인했다는 표시 — 지도(js/map.js initMap)가 한 번 읽고 지운다: 이때만 고른 구 중심 · 레벨 6.
                //   sessionStorage = 같은 탭에서 login -> map 으로 넘어가도 남고, 탭·앱을 닫으면 사라진다(묵은 표시가 다음 날 안 걸림).
                //   이미 로그인돼 있어 바로 넘어가는 위쪽 경로는 표시하지 않는다(평소 열기 = 마지막 위치).
                sessionStorage.setItem('ami_fresh_login', '1');
                window.location.href = 'map.html';
            } else {
                err.textContent = result.error;
                btn.disabled = false;
                btn.textContent = '로그인';
                // 비밀번호 필드 초기화 후 포커스
                document.getElementById('input-pw').value = '';
                document.getElementById('input-pw').focus();
            }
        }
    </script>
</body>
</html>
