        window.onpopstate = function(e) {

                var app = getParameterByName('app', e.state.url);

            }
        };

        $(document).ready(function() {

        });

        function notifySubmit(color, title, message, icon, duration) {
            //color: success, info, warning, danger
            //type: success, error, warning, info, default
            var type = 'default';
            var durationVal = 3000;

            if(!isNull(duration)) durationVal = duration;

            if(color == 'success') type = 'success'; else if(color == 'info') type = 'info'; else if(color == 'warning') type = 'warning'; else if(color == 'danger' || color == 'error') type = 'error';

            Vue.$toast.open({
                                message: message,
                                type: type,
                                position: isPc() ? 'bottom-right' : 'top',
                                duration: durationVal // all other options
                            });
        }

        function notifyData(data, title, icon = "icon-caution", duration = 3000) {
            try {
                if (!data || !data.CODE) {
                    if(data === 1){
                        notifySubmit('success', '성공', title+' 되었습니다.', 'icon-save');
                    }else{
                        notifySubmit('error', title, "알 수 없는 오류가 발생했습니다.", icon, duration);
                    }
                    return;
                }

                const code = String(data.CODE);
                const message = String(data.ERR_MSG);
                if(message.length <= 0){
                    notifySubmit('error', title, title+" 도중 알 수 없는 오류가 발생했습니다.", icon, duration);
                    return;
                }
                notifySubmit('error', title, "ERROR ["+code+": "+message+"]", icon, duration);
            }catch(e){
                console.error("notifyData 처리 중 오류:", e);
                notifySubmit('error', title, "에러 메시지 처리 중 문제가 발생했습니다.", icon, duration);
            }
        }
		
		function showNoticeModal(title, content) {
			document.getElementById("noticeTitle").textContent = '[공지사항] '+title;
			//document.getElementById("noticeContent").textContent = content;
			
			//content를 span태그 내의 p태그를 추가, 줄바꿈을 <br>로 수정하여 줄바꿈 적용
			const noticeContent = document.getElementById("noticeContent");
			noticeContent.innerHTML = ''; // 초기화
			const paragraph = document.createElement('p');
			paragraph.innerHTML = content.replace(/\n/g, '<br>');
			noticeContent.appendChild(paragraph);
			
			modal_open('noticeModal');
		}
		
		function closeToday(){
			const today = new Date().toISOString().slice(0, 10);
			localStorage.setItem("noticeCloseDate", today);
		}
		
        /*******************************************************************************************************************************************************************
         * javascript end
         ********************************************************************************************************************************************************************/
    </script>
</head>
